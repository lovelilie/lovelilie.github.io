name: Publish website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install the website's tools
        run: bun install

      - name: Work out the website address
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "PAGES_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE_PATH=/$REPO/" >> "$GITHUB_ENV"
          fi

      - name: Build the website
        run: bun run build
        env:
          GITHUB_PAGES: "true"

      - name: Get the built site ready for GitHub Pages
        run: bun scripts/prepare-pages.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
